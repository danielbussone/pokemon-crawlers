# Pokémon Crawlers — level outline (companion to GYM_CONTENT_PLAN.md)
#
# Structure per level: approach `areas` (each a segment with a wild pool + a
# mandatory mid-boss) then the `gym` (city segment + leader). Default 3 segments
# per level (2 approach + gym); tunable.
#
# NOTE ON "pokemon": the engine fights ONE enemy per gate (single-phase ace-boss).
# The `pokemon:` lists are the canonical teams — used for flavor + move sourcing,
# and for a future multi-phase upgrade. Built levels reflect the actual data.
#
# status: built = in the game now | partial = gym only | planned = design only

levels:
  - id: 1
    region: Pewter
    gym_type: Rock
    status: built
    areas:
      - name: Route 1
        segment_id: route_viridian
        wild_pool: [pidgey, rattata, weedle, nidoran_m]
        mid_boss:
          trainer: Rival
          pokemon: [starter_counter]   # Squirtle/Bulbasaur/Charmander vs player's pick
      - name: Viridian Forest
        segment_id: viridian_forest
        wild_pool: [caterpie, metapod, kakuna, weedle]
        mid_boss:
          trainer: Bug Catcher
          pokemon: [Butterfree, Beedrill]   # one variant per run
    gym:
      city: Pewter City
      segment_id: pewter
      wild_pool: [geodude, zubat, onix]
      boss:
        leader: Brock
        mechanic: block cycling
        badge: Boulder (-10% incoming)
        signature: rock_slide
        pokemon: [Geodude, Onix]

