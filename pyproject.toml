[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-crawlers"
version = "0.1.0"
description = "Pre-Godot combat PoC for Pokémon Crawlers — Pewter City CLI harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Daniel Bussone" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pokemon-crawlers = "pokemon_crawlers.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
